<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우주 탐사 미션 설계실</title><style>:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#eaf1ff;background:#091329}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#203967,#091329 60%);min-height:100vh}.wrap{max-width:1060px;margin:auto;padding:28px 20px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.eyebrow{color:#8ed9ee;font-weight:800;letter-spacing:2px;font-size:12px}h1{font-size:clamp(28px,5vw,44px);margin:8px 0}p{line-height:1.65}.muted{color:#aebdd5}.chip{background:#24395c;border:1px solid #50668b;border-radius:50px;padding:9px 14px;font-size:13px}.progress{height:8px;background:#293855;border-radius:20px;overflow:hidden;margin:28px 0 12px}.bar{height:100%;background:linear-gradient(90deg,#54d4cd,#8ba4ff);transition:.2s}.steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.step{border:1px solid #344a6a;background:#172846;color:#b9c8e1;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:13px}.step.active{background:#286c80;color:white;border-color:#74d7dc}.panel{background:#12223e;border:1px solid #344b70;border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 14px 44px #0004}h2{font-size:25px;margin:0 0 10px}.prompt{background:#1d3454;border-left:4px solid #55d3c8;padding:15px 18px;border-radius:8px;margin:22px 0;color:#e2f9fa}.field{margin:19px 0}label{display:block;font-weight:750;margin-bottom:9px}input,textarea,select{width:100%;border:1px solid #506589;background:#0b1930;color:white;padding:13px 14px;border-radius:11px;font:inherit}textarea{min-height:95px;resize:vertical}input::placeholder,textarea::placeholder{color:#8091ad}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.option{padding:15px;border:1px solid #455a7b;border-radius:13px;background:#192b49;cursor:pointer;text-align:left;color:white;font:inherit}.option.selected{border:2px solid #55d6c9;background:#1e5263}.hint{font-size:13px;color:#a5b9d5;margin-top:7px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:25px;flex-wrap:wrap}button{cursor:pointer}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:800;background:#64d9d0;color:#072437}.btn.secondary{background:#273d60;color:#e8f1ff}.btn:disabled{opacity:.45;cursor:not-allowed}.check{display:flex;gap:10px;align-items:flex-start;margin:13px 0;color:#d4e4f7}.check input{width:auto;margin-top:5px}.summary{white-space:pre-wrap;background:#0c1930;padding:20px;border-radius:14px;line-height:1.9;color:#e3eeff}.notice{margin-top:22px;font-size:13px;color:#a5bad6}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}a{color:#7de4e0}.pill{display:inline-block;border-radius:30px;padding:5px 10px;background:#294d66;color:#a5fff0;font-size:12px;margin:5px 5px 0 0}@media(max-width:600px){.wrap{padding:18px 12px}.panel{border-radius:17px}.steps .step{flex:1 1 27%}}</style></head><body><main class="wrap"><header><div><div class="eyebrow">SPACE MISSION LAB · 중학교 과학 2</div><h1>🚀 우주 탐사 미션 설계실</h1><p class="muted">우리 모둠만의 우주 탐사 계획을 세우고, 최종 보고서를 PDF로 저장하고 선생님께 온라인으로 제출하세요.</p></div><span class="chip">6단계 미션 · 모둠 활동</span></header><div class="progress"><div class="bar" id="bar"></div></div><nav class="steps" id="steps"></nav><section class="panel"><div id="content"></div><div class="actions"><button class="btn secondary" id="prev" onclick="move(-1)">← 이전 단계</button><button class="btn" id="next" onclick="move(1)">다음 단계 →</button></div></section><div class="footer"><button class="btn secondary" onclick="saveDraft()">💾 작성 내용 저장</button><button class="btn secondary" onclick="if(confirm('작성 내용을 모두 지울까요?')){localStorage.removeItem('spaceMissionV2');location.reload()}">처음부터 다시</button></div><p class="notice">작성 내용은 이 브라우저에 자동 저장됩니다. 공용 기기에서는 개인정보를 최소한으로 입력하세요. PDF는 이 기기에서 직접 생성됩니다. [스프레드시트로 제출]을 누르면 작성 내용이 선생님의 구글 스프레드시트로 전송됩니다.</p></main><script>
const names=['팀 결성','탐사 대상','탐사 목적','탐사 방법','임무·성과','최종 보고서'];let state={team:'',members:'',mission:'',target:'',feature:'',caseStudy:'',caseSource:'',question:'',purpose:'',method:'',methodWhy:'',duration:'',crew:'',tasks:'',equipment:'',risk:'',solution:'',outcome:'',meaning:'',references:''};try{Object.assign(state,JSON.parse(localStorage.getItem('spaceMissionV2')||'{}'))}catch(e){}let current=0;const $=id=>document.getElementById(id);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(key,label,placeholder,help='',long=false){return `<div class="field"><label for="${key}">${label}</label>${long?`<textarea id="${key}" data-key="${key}" placeholder="${esc(placeholder)}">${esc(state[key])}</textarea>`:`<input id="${key}" data-key="${key}" value="${esc(state[key])}" placeholder="${esc(placeholder)}">`}${help?`<div class="hint">${help}</div>`:''}</div>`}function choose(key,values){return `<div class="options">${values.map(v=>`<button type="button" class="option ${state[key]===v?'selected':''}" onclick="setChoice('${key}','${v}')">${v}</button>`).join('')}</div>`}function setChoice(k,v){state[k]=v;saveDraft();render()}function saveDraft(){document.querySelectorAll('[data-key]').forEach(e=>state[e.dataset.key]=e.value);localStorage.setItem('spaceMissionV2',JSON.stringify(state))}function report(){return `우주 탐사 계획 보고서\n\n[1] 우리 탐사팀\n모둠명: ${state.team||'미작성'}\n팀원: ${state.members||'미작성'}\n탐사 임무 이름: ${state.mission||'미작성'}\n\n[2] 탐사 대상과 근거\n탐사 천체: ${state.target||'미작성'}\n천체의 특징과 탐사 환경: ${state.feature||'미작성'}\n참고한 실제 우주 탐사 사례: ${state.caseStudy||'미작성'}\n사례 정보 출처: ${state.caseSource||'미작성'}\n\n[3] 탐사 목적\n핵심 탐구 질문: ${state.question||'미작성'}\n탐사 목적: ${state.purpose||'미작성'}\n\n[4] 탐사 방법과 근거\n탐사 방식: ${state.method||'미작성'}\n이 방법을 선택한 이유: ${state.methodWhy||'미작성'}\n탐사 기간: ${state.duration||'미작성'}\n참여 인원(또는 무인 여부): ${state.crew||'미작성'}\n\n[5] 구체적인 임무와 예상 성과\n주요 임무: ${state.tasks||'미작성'}\n필요한 장비와 역할: ${state.equipment||'미작성'}\n예상되는 어려움: ${state.risk||'미작성'}\n해결 방안: ${state.solution||'미작성'}\n예상 성과: ${state.outcome||'미작성'}\n탐사의 과학적·사회적 의미: ${state.meaning||'미작성'}\n참고 자료: ${state.references||'미작성'}`}function render(){const pages=[`<h2>01 · 탐사팀을 결성하자</h2><p class="muted">여러분은 우주 탐사 프로젝트를 맡은 연구팀입니다. 팀의 이름과 임무명을 정해 보세요.</p><div class="prompt">💬 탐사팀이 꼭 밝혀내고 싶은 우주의 비밀은 무엇일까요?</div>${field('team','모둠 이름','예: 은하 탐험대')}${field('members','팀원 이름','예: 김○○, 이○○, 박○○')}${field('mission','탐사 임무 이름','예: 붉은 행성의 물 흔적을 찾아라!')}`,`<h2>02 · 어디를 탐사할까?</h2><p class="muted">탐사 대상을 정하고, 천체의 환경과 실제 탐사 사례를 조사하세요.</p><div class="prompt">🔎 탐사 천체의 특징을 알아야 적절한 탐사 방법을 고를 수 있어요.</div><label>탐사 천체 선택</label>${choose('target',['달','화성','금성','목성의 위성','토성의 위성','소행성','기타'])}${field('feature','탐사 천체의 특징 (환경·표면·대기 등)','예: 대기가 매우 희박하고 표면 온도가 낮다. 따라서 …','특징을 2가지 이상 조사하고, 탐사에 어떤 영향을 미칠지 적어 보세요.',true)}${field('caseStudy','참고한 실제 우주 탐사 사례','예: 퍼서비어런스 화성 탐사 로버의 임무와 성과', '사례의 탐사 대상·목적·성과를 확인해 보세요.',true)}${field('caseSource','실제 탐사 사례의 정보 출처','예: NASA 공식 홈페이지 / 자료 제목 또는 URL')}`,`<h2>03 · 무엇을 알아낼까?</h2><p class="muted">막연한 목표보다 관찰하거나 측정할 수 있는 질문을 정해 보세요.</p><div class="prompt">🎯 “화성을 탐사한다”보다 “화성에서 과거 물의 흔적을 찾는다”가 더 구체적이에요.</div>${field('question','핵심 탐구 질문','예: 이 천체에 과거 액체 상태의 물이 존재했을까?', '',true)}${field('purpose','탐사 목적 (무엇을, 왜 조사하나요?)','예: 표면의 암석을 분석하여 과거 물의 존재 가능성을 조사한다.', '탐구 질문과 탐사 목적이 서로 연결되도록 작성하세요.',true)}`,`<h2>04 · 어떻게 탐사할까?</h2><p class="muted">탐사 천체의 환경과 목적을 고려해 가장 알맞은 방법을 선택하세요.</p><div class="prompt">🛰️ 궤도선은 넓은 지역을 관측하고, 착륙선·로버는 표면을 직접 조사할 수 있어요.</div><label>주요 탐사 방식</label>${choose('method',['궤도선','착륙선','탐사 로버','우주 망원경','유인 탐사','시료 귀환','기타'])}${field('methodWhy','선택한 방법이 탐사 목적에 적합한 이유','예: 표면의 암석을 직접 분석해야 하므로 로버를 선택했다.', '',true)}${field('duration','예상 탐사 기간','예: 6개월 / 2년')}${field('crew','탐사 인원 또는 무인 여부','예: 무인 탐사 / 우주인 4명')}`,`<h2>05 · 실제 임무를 설계하자</h2><p class="muted">실제로 무엇을 조사하고 어떤 장비를 사용할지 구체화해 보세요.</p><div class="prompt">🧪 장비 이름만 쓰지 말고, 그 장비로 어떤 자료를 얻을 수 있는지 설명하세요.</div>${field('tasks','구체적인 탐사 임무 (2~3가지)','예: ① 착륙 지점 촬영 ② 암석 시료 분석 ③ 대기 성분 측정','탐사 목적을 달성할 수 있는 활동으로 작성하세요.',true)}${field('equipment','필요한 장비와 각각의 역할','예: 카메라 — 지형 촬영 / 분광기 — 암석 성분 분석','탐사 환경을 고려하여 장비를 선택하세요.',true)}${field('risk','탐사 중 예상되는 어려움','예: 먼지 폭풍으로 태양 전지판의 발전량이 감소할 수 있다.', '',true)}${field('solution','어려움을 해결할 방법','예: 보조 전원과 먼지 제거 장치를 준비한다.', '',true)}${field('outcome','탐사 성공 시 얻을 수 있는 과학적 성과','예: 물의 흔적을 확인할 수 있는 지질 자료 확보', '',true)}${field('meaning','이 탐사가 인류에게 주는 의미','예: 태양계의 형성과 생명체 존재 가능성을 이해하는 데 기여한다.', '',true)}${field('references','참고 자료 (선택)','예: 기관명, 문서명, URL', '',true)}`,`<h2>06 · 최종 탐사 보고서</h2><p class="muted">아래 내용을 검토한 뒤 PDF로 저장하여 패들릿에 올리세요.</p><div class="prompt">✅ 점검: 실제 탐사 사례를 참고했나요? 목적·방법·장비가 연결되나요? 계획이 구체적인가요?</div><div class="check"><input type="checkbox" id="c1"><label for="c1">탐사 천체의 특징을 조사하고 근거를 적었다.</label></div><div class="check"><input type="checkbox" id="c2"><label for="c2">탐사 목적에 적합한 방법과 장비를 선택했다.</label></div><div class="check"><input type="checkbox" id="c3"><label for="c3">예상 성과와 어려움, 해결 방안을 작성했다.</label></div><div class="summary">${esc(report())}</div><div class="actions"><button class="btn" onclick="downloadPDF()">📄 PDF 보고서 다운로드</button><button class="btn" id="submitBtn" onclick="submitToSheet()">☁️ 스프레드시트로 제출</button><button class="btn secondary" onclick="window.print()">🖨️ 인쇄 / PDF로 저장</button></div><p id="submitStatus" role="status" aria-live="polite" class="hint">제출은 버튼을 눌렀을 때만 전송됩니다.</p><p class="hint">파일 이름: 우주탐사보고서_모둠명.pdf · PDF 파일을 패들릿에 업로드하세요.</p>`];$('steps').innerHTML=names.map((n,i)=>`<button class="step ${i===current?'active':''}" onclick="go(${i})">${i+1}. ${n}</button>`).join('');$('bar').style.width=((current+1)/6*100)+'%';$('content').innerHTML=pages[current];$('prev').disabled=current===0;$('next').textContent=current===5?'보고서 완성 ✓':'다음 단계 →';$('next').disabled=current===5}function go(i){saveDraft();current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function move(d){go(Math.min(5,Math.max(0,current+d)))}
// Browser-native, dependency-free PDF export: render Korean text using canvas and embed JPEG pages into a PDF.
function downloadPDF(){saveDraft();let sections=[['우주 탐사 계획 보고서',`모둠: ${state.team||'미작성'}    임무: ${state.mission||'미작성'}`],['01  탐사팀',`팀원: ${state.members||'미작성'}`],['02  탐사 대상',`탐사 천체: ${state.target||'미작성'}\n천체의 특징과 탐사 환경: ${state.feature||'미작성'}\n실제 탐사 사례: ${state.caseStudy||'미작성'}\n사례 출처: ${state.caseSource||'미작성'}`],['03  탐사 목적',`핵심 탐구 질문: ${state.question||'미작성'}\n탐사 목적: ${state.purpose||'미작성'}`],['04  탐사 방법',`탐사 방식: ${state.method||'미작성'}\n선택한 이유: ${state.methodWhy||'미작성'}\n탐사 기간: ${state.duration||'미작성'}\n탐사 인원: ${state.crew||'미작성'}`],['05  임무와 예상 성과',`주요 임무: ${state.tasks||'미작성'}\n필요한 장비와 역할: ${state.equipment||'미작성'}\n예상되는 어려움: ${state.risk||'미작성'}\n해결 방안: ${state.solution||'미작성'}\n예상 성과: ${state.outcome||'미작성'}\n탐사의 의미: ${state.meaning||'미작성'}\n참고 자료: ${state.references||'미작성'}`]];let W=1240,H=1754,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;let ctx=canvas.getContext('2d'),pages=[],y=0;function init(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0d2746';ctx.fillRect(0,0,W,20);ctx.fillStyle='#64748b';ctx.font='23px "Malgun Gothic",sans-serif';ctx.fillText('SPACE MISSION LAB  |  중학교 과학 2',88,75);y=120}function wrapLine(text,maxWidth,font){ctx.font=font;let lines=[];for(let paragraph of String(text).split('\n')){if(!paragraph){lines.push('');continue}let line='';for(let char of paragraph){if(ctx.measureText(line+char).width>maxWidth&&line){lines.push(line);line=char}else line+=char}lines.push(line)}return lines}function flush(){ctx.fillStyle='#9ba7b6';ctx.font='21px "Malgun Gothic",sans-serif';ctx.fillText('우주 탐사 계획 보고서',88,H-65);pages.push(canvas.toDataURL('image/jpeg',.88).split(',')[1]);init()}init();sections.forEach(([title,body],idx)=>{let font='29px "Malgun Gothic",sans-serif',lines=wrapLine(body,W-180,font);let need=74+lines.length*48+30;if(y+need>H-125)flush();ctx.fillStyle='#0b5474';ctx.font='bold 35px "Malgun Gothic",sans-serif';ctx.fillText(title,88,y+33);y+=72;ctx.fillStyle='#1b2b43';ctx.font=font;for(let line of lines){if(y+48>H-125)flush();ctx.fillText(line,92,y+27);y+=48}y+=30;ctx.strokeStyle='#e3e9f0';ctx.beginPath();ctx.moveTo(88,y);ctx.lineTo(W-88,y);ctx.stroke();y+=26});flush();let bytes=pages.map(base64=>Uint8Array.from(atob(base64),c=>c.charCodeAt(0)));let objs=[],add=s=>{objs.push(s);return objs.length},catalog=add(''),root=add(''),pageIds=[];bytes.forEach((b,i)=>{let im=add({binary:b,head:`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${b.length} >>`});let content=`q 595 0 0 842 0 0 cm /Im${i} Do Q`,co=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`),pg=add(`<< /Type /Page /Parent ${root} 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${co} 0 R >>`);pageIds.push(pg)});objs[catalog-1]=`<< /Type /Catalog /Pages ${root} 0 R >>`;objs[root-1]=`<< /Type /Pages /Kids [${pageIds.map(x=>x+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;let encoder=new TextEncoder(),chunks=[],pos=0,offsets=[0];function push(data){let b=typeof data==='string'?encoder.encode(data):data;chunks.push(b);pos+=b.length}push('%PDF-1.4\n');objs.forEach((o,i)=>{offsets.push(pos);push(`${i+1} 0 obj\n`);if(typeof o==='string')push(o);else{push(o.head+'\nstream\n');push(o.binary);push('\nendstream')}push('\nendobj\n')});let start=pos;push(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`);offsets.slice(1).forEach(x=>push(String(x).padStart(10,'0')+' 00000 n \n'));push(`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${start}\n%%EOF`);let blob=new Blob(chunks,{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='우주탐사보고서_'+(state.team||'우리모둠').replace(/[\\/:*?"<>|]/g,'_')+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
// 선생님: Apps Script 웹 앱의 /exec URL을 아래에 붙여 넣으세요.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTn7JQTzJE2tUmPkQz7JsSmxgyr1IccdbVAbr2Ln5iNotTDjmWxyBGhR6oj_SJbpvP/exec';
let isSubmitting = false;
function submissionId(){
  if(window.crypto && crypto.randomUUID) return 'mission_'+crypto.randomUUID().replace(/-/g,'');
  return 'mission_'+Date.now()+'_'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
}
function setSubmitStatus(message, error=false){
  const el=$('submitStatus'); if(el){el.textContent=message;el.style.color=error?'#ffb7b7':'#a5fff0';}
}
function checkReceipt(id, timeout=10000){
  return new Promise((resolve,reject)=>{
    const cb='missionCallback_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    let settled=false;
    const timer=setTimeout(()=>finish(new Error('응답 시간 초과')),timeout);
    function finish(err,result){if(settled)return;settled=true;clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(result);}
    window[cb]=data=>finish(null,Boolean(data && data.received));
    script.onerror=()=>finish(new Error('확인 요청 실패'));
    script.src=SCRIPT_URL+'?id='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
    document.head.appendChild(script);
  });
}
async function submitToSheet(){
  if(isSubmitting)return;
  saveDraft();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(SCRIPT_URL)){
    setSubmitStatus('아직 선생님이 제출 주소를 설정하지 않았습니다. PDF 저장은 계속 사용할 수 있어요.',true);return;
  }
  if(!state.team.trim() || !state.target.trim()){
    setSubmitStatus('모둠명과 탐사 천체는 반드시 입력해야 합니다.',true);return;
  }
  if(!confirm('작성한 탐사 계획을 선생님께 제출할까요?'))return;
  isSubmitting=true;
  const button=$('submitBtn');if(button)button.disabled=true;
  setSubmitStatus('제출 중입니다. 이 창을 닫지 마세요...');
  const id=submissionId();
  try{
    // iframe 폼 제출: 로컬 HTML(file://)에서도 CORS 사전요청 없이 POST합니다.
    // 실제 성공 여부는 별도 JSONP 조회로 확인하며, 전송 자체만으로 성공이라 표시하지 않습니다.
    const iframe=document.createElement('iframe');iframe.name='missionPost_'+id;iframe.style.display='none';
    const form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target=iframe.name;form.style.display='none';
    const input=document.createElement('input');input.name='payload';input.value=JSON.stringify({...state,submissionId:id});form.appendChild(input);
    document.body.appendChild(iframe);document.body.appendChild(form);form.submit();
    let confirmed=false;
    for(let attempt=0;attempt<7;attempt++){
      await new Promise(r=>setTimeout(r,1500+attempt*700));
      try{if(await checkReceipt(id,7000)){confirmed=true;break;}}catch(e){}
    }
    form.remove();setTimeout(()=>iframe.remove(),1000);
    if(confirmed){setSubmitStatus('✅ 제출 확인 완료! 선생님 스프레드시트에 저장되었습니다. PDF도 별도로 다운로드하세요.');}
    else{setSubmitStatus('제출 여부를 확인하지 못했습니다. 다시 제출하기 전에 선생님께 스프레드시트에 기록되었는지 확인해 주세요.',true);}
  }catch(e){setSubmitStatus('전송 오류: '+e.message+' / 선생님께 확인해 주세요.',true);}
  finally{isSubmitting=false;const btn=$('submitBtn');if(btn)btn.disabled=false;}
}
